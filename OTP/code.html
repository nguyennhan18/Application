<style>

<body class="bg-background text-on-background antialiased min-h-screen flex flex-col items-center justify-center font-body-lg">
<!-- Top Navigation for Transactional Screen -->
<header class="w-full fixed top-0 left-0 flex items-center justify-between px-margin-main h-14 bg-background z-50">
<button aria-label="Quay lại" class="flex items-center justify-center p-2 rounded-full hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<!-- Title is deliberately empty for minimalist transactional view -->
<div class="w-10"></div> <!-- Spacer for balance -->
</header>
<main class="w-full max-w-md px-margin-main flex flex-col justify-center flex-grow pt-14 pb-8">
<!-- Header Section -->
<div class="text-center mb-8">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-primary-container text-on-primary-container mb-4">
<span class="material-symbols-outlined" style="font-size: 32px; font-variation-settings: 'FILL' 1;">security</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-primary mb-2">Nhập mã OTP</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">
                Mã OTP đã được gửi đến số <br/>
<span class="font-headline-sm text-headline-sm text-on-background mt-1 inline-block">+84 987 654 321</span>
</p>
</div>
<!-- OTP Input Section -->
<div class="flex justify-center gap-stack-gap mb-8">
<input autofocus="" class="otp-input w-14 h-16 text-center font-headline-lg text-headline-lg bg-surface-container-low border-b-2 border-outline rounded-t-DEFAULT focus:border-primary focus:bg-surface-container-high focus:outline-none transition-colors" maxlength="1" type="number"/>
<input class="otp-input w-14 h-16 text-center font-headline-lg text-headline-lg bg-surface-container-low border-b-2 border-outline rounded-t-DEFAULT focus:border-primary focus:bg-surface-container-high focus:outline-none transition-colors" maxlength="1" type="number"/>
<input class="otp-input w-14 h-16 text-center font-headline-lg text-headline-lg bg-surface-container-low border-b-2 border-outline rounded-t-DEFAULT focus:border-primary focus:bg-surface-container-high focus:outline-none transition-colors" maxlength="1" type="number"/>
<input class="otp-input w-14 h-16 text-center font-headline-lg text-headline-lg bg-surface-container-low border-b-2 border-outline rounded-t-DEFAULT focus:border-primary focus:bg-surface-container-high focus:outline-none transition-colors" maxlength="1" type="number"/>
<input class="otp-input w-14 h-16 text-center font-headline-lg text-headline-lg bg-surface-container-low border-b-2 border-outline rounded-t-DEFAULT focus:border-primary focus:bg-surface-container-high focus:outline-none transition-colors" maxlength="1" type="number"/>
<input class="otp-input w-14 h-16 text-center font-headline-lg text-headline-lg bg-surface-container-low border-b-2 border-outline rounded-t-DEFAULT focus:border-primary focus:bg-surface-container-high focus:outline-none transition-colors" maxlength="1" type="number"/>
</div>
<!-- Verify Button -->
<button class="w-full bg-primary text-on-primary font-headline-sm text-headline-sm py-4 rounded-lg shadow-sm hover:opacity-90 active:scale-95 transition-all mb-6">
            Xác thực
        </button>
<!-- Resend Section -->
<div class="text-center font-body-sm text-body-sm">
<p class="text-on-surface-variant mb-1">Chưa nhận được mã?</p>
<div class="flex items-center justify-center gap-2">
<button class="text-primary font-semibold hover:underline disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:no-underline" disabled="" id="resend-btn">
                    Gửi lại mã
                </button>
<span class="text-on-surface-variant" id="timer">(00:59)</span>
</div>
</div>
</main>
<script>
        // OTP Input Logic
        const inputs = document.querySelectorAll('.otp-input');
        
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length > 1) {
                    e.target.value = e.target.value.slice(0, 1); // Limit to 1 char
                }
                if (e.target.value !== '') {
                    if (index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && e.target.value === '') {
                    if (index > 0) {
                        inputs[index - 1].focus();
                    }
                }
            });
        });

        // Timer Logic
        let timeLeft = 59;
        const timerDisplay = document.getElementById('timer');
        const resendBtn = document.getElementById('resend-btn');

        const countdown = setInterval(() => {
            timeLeft--;
            const seconds = timeLeft < 10 ? `0${timeLeft}` : timeLeft;
            timerDisplay.textContent = `(00:${seconds})`;

            if (timeLeft <= 0) {
                clearInterval(countdown);
                timerDisplay.textContent = '';
                resendBtn.disabled = false;
            }
        }, 1000);
    </script>
