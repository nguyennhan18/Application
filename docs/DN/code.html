<main class="flex-1 flex flex-col justify-center px-margin-main pb-section-padding pt-12 max-w-md mx-auto w-full">
<!-- Logo Header -->
<div class="flex flex-col items-center mb-10 text-center">
<div class="w-24 h-24 mb-6 rounded-2xl overflow-hidden bg-surface-container-lowest shadow-[0px_2px_8px_rgba(0,0,0,0.05)] border border-surface-variant flex items-center justify-center p-2">
<img alt="Healthy Hospital Logo" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida/AEtjO1XuVU9aoY5SlHK88hK9BqZoRatZ3cokBFMmldrzHpTG2S5_h5jEiolIJTuwHQUD1OlxP6fTiIXM1P17Lf9ez8az3tyWlb1LC29w75lBwSEuHtR8XMqKJGepc0WTjh9qZaixAhLPPnczQG-IrVkMjxMcZGK16c6xk0Ke_93gqM1Pf3BbSLiKXG1UQQ8OCTNjFUCqAs8rqtvQ9s7nuJQNxxy-4kD1-i7H8smzUvQIuuasUsy6QZo55PHsnPo"/>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-background mb-2">Đăng nhập</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Chào mừng đến với Healthy Hospital</p>
</div>
<!-- Phone Input Section -->
<div class="bg-surface-container-lowest rounded-xl shadow-[0px_2px_8px_rgba(0,0,0,0.05)] border border-surface-variant p-4 mb-6">
<label class="block font-label-caps text-label-caps text-on-surface-variant uppercase mb-2" for="phone-number">Số điện thoại</label>
<div class="flex items-center">
<button class="flex items-center justify-center w-[80px] h-12 bg-surface-container-low text-on-surface rounded-l-lg border-r border-surface-variant px-3 focus:outline-none focus:ring-2 focus:ring-primary focus:z-10 transition-colors" type="button">
<span class="mr-1">🇻🇳</span>
<span class="font-body-lg text-body-lg">+84</span>
<span class="material-symbols-outlined ml-1 text-[20px] text-on-surface-variant">arrow_drop_down</span>
</button>
<input autocomplete="tel" class="flex-1 h-12 bg-surface-container-low text-on-surface rounded-r-lg px-4 border-none focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-colors font-body-lg text-body-lg" id="phone-number" placeholder="Nhập số điện thoại" type="tel"/>
</div>
</div>
<!-- Primary Action -->
<button class="w-full h-14 bg-primary text-on-primary rounded-xl font-headline-sm text-headline-sm flex items-center justify-center mb-8 shadow-sm active:scale-[0.98] transition-transform" type="button">
            Nhận mã OTP
        </button>
<!-- Divider -->
<div class="flex items-center mb-8">
<div class="flex-1 h-px bg-outline-variant"></div>
<span class="px-4 font-label-sm text-label-sm text-on-surface-variant uppercase">Hoặc đăng nhập bằng</span>
<div class="flex-1 h-px bg-outline-variant"></div>
</div>
<!-- Social Logins -->
<div class="flex flex-col gap-3">
<button class="w-full h-12 bg-surface-container-lowest border border-outline-variant rounded-xl flex items-center justify-center gap-3 active:bg-surface-container-low transition-colors text-on-surface font-body-lg text-body-lg" type="button">
<img class="w-6 h-6 object-contain" data-alt="A clean, minimalist vector icon of the Google 'G' logo, featuring its signature four colors (red, yellow, green, blue) on a pure white background. The icon is simple, modern, and clearly identifiable as a sign-in button asset. Soft, even lighting." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBkzVC4i0k0PDK6ADawTKBvHuNR6y5JNSL7umNJa1JRV2DSp2t9SymtTMQlDdEpTQ3HutB8TYdwmZzLlJlpCbTIDH69LcTkbOyj3y6MwFcx9hVQw_tU3opjMaDl7WywqKJiYJCoDjCfQ4Edo8gdnP65wulvg1f-tYU53tvIn2zNBys1bj5LUfEb8HPdB5ETc_auA0WpQUmqG-iK9dI3sFtUFfoy6oSZWNy1tWjwSd6IigcswNVil6sK"/>

            </button>
<button class="w-full h-12 bg-[#000000] text-white rounded-xl flex items-center justify-center gap-3 active:bg-gray-900 transition-colors font-body-lg text-body-lg" type="button">
<span class="material-symbols-outlined" data-icon="apple" style="font-variation-settings: 'FILL' 1;">file_download</span>

<p class="font-label-sm text-label-sm text-on-surface-variant">

        </p>
